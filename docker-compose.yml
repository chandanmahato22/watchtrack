services:
  postgres:
    image: postgres:16
    container_name: watchtrack-postgres

    environment:
      POSTGRES_DB: watchtrack
      POSTGRES_USER: watchtrack
      POSTGRES_PASSWORD: watchtrack123


    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  redis:
    image: redis:7
    container_name: watchtrack-redis

    ports:
      - "6379:6379"

    volumes:
      - "redis_data:/data"

    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: watchtrack-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

volumes:
  postgres_data:
  redis_data: