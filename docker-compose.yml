services:
  postgres:
    image: postgres:16
    container_name: watchtrack-postgres

    environment:
      POSTGRES_DB: watchtrack
      POSTGRES_USER: watchtrack
      POSTGRES_PASSWORD: watchtrack123


    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  redis:
    image: redis:7
    container_name: watchtrack-redis

    ports:
      - "6379:6379"

    volumes:
      - "redis_data:/data"

    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: